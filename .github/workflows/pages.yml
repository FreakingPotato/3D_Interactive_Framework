name: Build and deploy interactive demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate included data and assets
        run: python scripts/verify_release.py
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build static website
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: python scripts/build_site.py --base "$SITE_BASE" --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
